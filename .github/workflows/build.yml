name: Build

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Committed fonts match the Aseprite source
        run: git diff --exit-code -- bitroot.ttf bitroot.woff2
      # PNG bytes can differ between zlib builds, so the images are compared pixel by pixel
      - name: Committed README images and site data match the source
        run: |
          git diff --exit-code -- demo/glyphs.json
          python - <<'EOF'
          import io, pathlib, subprocess
          from PIL import Image
          stale = []
          for p in sorted(pathlib.Path("images").glob("*.png")):
              old = subprocess.run(["git", "show", f"HEAD:{p.as_posix()}"], capture_output=True).stdout
              pixels = lambda im: (im.size, im.convert("RGBA").tobytes())
              if not old or pixels(Image.open(io.BytesIO(old))) != pixels(Image.open(p)):
                  stale.append(p.as_posix())
          if stale:
              raise SystemExit("Run python build.py and commit: " + ", ".join(stale))
          EOF

      - name: Publish release for v* tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import json; print(json.load(open('src/font.json', encoding='utf-8'))['version'])")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in src/font.json"; exit 1; }
          zip "bitroot-$GITHUB_REF_NAME.zip" bitroot.ttf bitroot.woff2 LICENSE.txt
          # 0.x versions are pre-releases; 1.0 and later are normal releases
          pre=$([ "${version%%.*}" = 0 ] && echo --prerelease || true)
          zipfile="bitroot-$GITHUB_REF_NAME.zip"
          # a re-pushed tag updates the existing release instead of failing
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zipfile" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zipfile" --title "Bitroot $version" --generate-notes $pre
          fi

  # Publishes the specimen site (demo/ plus the fonts) to GitHub Pages.
  # Needs Settings -> Pages -> Source: "GitHub Actions" turned on once.
  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: mkdir _site && cp -r demo/. _site/ && cp bitroot.ttf bitroot.woff2 _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
